<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 3 Layout - Flexbox &amp; Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      background-color: #f4f5f7;
    }

    h2 {
      margin: 24px 0 12px;
      font-size: 1.1rem;
    }

    .box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
      border-radius: 6px;
    }

    .box-a { background-color: #e55353; }
    .box-b { background-color: #f08a24; }
    .box-c { background-color: #2ea043; }
    .box-d { background-color: #2f81f7; }
    .box-e { background-color: #8957e5; }
    .box-f { background-color: #db61a2; }

    /* 1. FLEXBOX VERSION */
    .flex-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .flex-layout .box {
      flex: 1 1 calc(33.333% - 12px);
      min-width: 160px;
    }

    /* 2. GRID VERSION */
    .grid-layout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 600px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h2>Flexbox Layout</h2>
  <div class="flex-layout">
    <div class="box box-a">A</div>
    <div class="box box-b">B</div>
    <div class="box box-c">C</div>
    <div class="box box-d">D</div>
    <div class="box box-e">E</div>
    <div class="box box-f">F</div>
  </div>

  <h2>Grid Layout</h2>
  <div class="grid-layout">
    <div class="box box-a">A</div>
    <div class="box box-b">B</div>
    <div class="box box-c">C</div>
    <div class="box box-d">D</div>
    <div class="box box-e">E</div>
    <div class="box box-f">F</div>
  </div>
</body>
</html>
